[project]
name = "codex-claude-orchestrator"
version = "0.7.1"
description = "Supervised Claude Code execution with MCP and local progress views"
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff==0.16.10", "mypy==2.4.0"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Baseline f1cbe20 measured with Ruff 0.16.10; prevent increases beyond its maxima.
select = ["F", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 59

[tool.ruff.lint.pylint]
max-branches = 59
max-statements = 145

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
files = [
    "scripts/identity_manifest.py",
    "scripts/shared_io.py",
    "skills/codex-claude-orchestrator/scripts/lane_lock.py",
    "skills/codex-claude-orchestrator/scripts/bridge_errors.py",
    "skills/codex-claude-orchestrator/scripts/result_schema.py",
]
