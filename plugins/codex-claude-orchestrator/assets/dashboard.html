<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Claude 协作工作台</title>
<style>
:root{color-scheme:light dark;
--bg:#F4F2EE;--bg2:#FBFAF7;--panel:#FFFFFF;--line:#E2DFD8;--text:#1C1B19;--muted:#5F5D58;--focus:#1F4FB8;
--active-fg:#1F4FB8;--active-bg:#EAF0FC;--active-bd:#BFD0F3;--ok-fg:#17704B;--ok-bg:#E6F3EC;--ok-bd:#B7DBC7;
--warn-fg:#9A4B00;--warn-bg:#FCF1E3;--warn-bd:#EDCB9E;--bad-fg:#A8271B;--bad-bg:#FBEAE8;--bad-bd:#EDBDB7;
--plain-fg:#3F3D39;--plain-bg:#F2F1ED;--plain-bd:#CFCBC2}
@media(prefers-color-scheme:dark){:root{
--bg:#17181B;--bg2:#1B1C1F;--panel:#232529;--line:#34373C;--text:#F3F4F6;--muted:#AFB3BA;--focus:#8FB0FF;
--active-fg:#9DB8FF;--active-bg:#1E2A45;--active-bd:#3A5184;--ok-fg:#7FD3A8;--ok-bg:#16302A;--ok-bd:#2F6B50;
--warn-fg:#FFC870;--warn-bg:#3A2A10;--warn-bd:#8A6424;--bad-fg:#FFB0A6;--bad-bg:#3D1D1A;--bad-bd:#8C4A42;
--plain-fg:#D5D7DB;--plain-bg:#2A2B2E;--plain-bd:#4A4D52}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 10px}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
code,pre,.mono{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:12px}
.topbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{font-weight:600;font-size:15px}
.spacer{flex:1}
.pill{font-size:12px;border:1px solid var(--ok-bd);color:var(--ok-fg);border-radius:999px;padding:1px 10px}
.pill.down{color:var(--warn-fg);border-color:var(--warn-bd)}
.pill.auth{color:var(--bad-fg);border-color:var(--bad-bd)}
.banner{padding:10px 20px;font-size:13px;background:var(--warn-bg);color:var(--warn-fg);border-bottom:1px solid var(--warn-bd)}
.banner.auth{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-bd)}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 48px)}
.list{border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 48px);position:sticky;top:0}
.list-head{display:flex;justify-content:space-between;margin:0 2px 8px}
.card{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:10px;margin-bottom:6px}
.card:hover{background:var(--bg2)}
.card[aria-current=true]{border-color:var(--text);background:var(--bg2)}
.card-title{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.badge{display:inline-block;font-size:12px;line-height:1.5;border-radius:5px;padding:0 7px;border:1px solid var(--plain-bd);background:var(--plain-bg);color:var(--plain-fg)}
.t-active{color:var(--active-fg);background:var(--active-bg);border-color:var(--active-bd)}
.t-ok{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-bd)}
.t-warn{color:var(--warn-fg);background:var(--warn-bg);border-color:var(--warn-bd)}
.t-bad{color:var(--bad-fg);background:var(--bad-bg);border-color:var(--bad-bd)}
.t-wait{border-style:dashed}
.detail{padding:18px clamp(14px,4vw,44px) 60px;background:var(--bg2);min-width:0}
.inner{max-width:980px;margin:0 auto}
.empty{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tab[aria-selected=true]{border-color:var(--text);font-weight:600}
.title{font-size:21px;font-weight:600;overflow-wrap:anywhere;margin:2px 0 6px}
.facts{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:12px;color:var(--muted)}
.facts span b{font-weight:500;color:var(--text);overflow-wrap:anywhere}
.link{border:0;background:none;padding:0;color:var(--focus);text-decoration:underline;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-width:0}
.box h2{font-size:13px;margin-bottom:6px}
.box.t-ok,.box.t-warn,.box.t-bad,.box.t-active{color:var(--text)}
.box.t-ok{border-color:var(--ok-bd);border-top:3px solid var(--ok-fg)}
.box.t-warn{border-color:var(--warn-bd);border-top:3px solid var(--warn-fg)}
.box.t-bad{border-color:var(--bad-bd);border-top:3px solid var(--bad-fg)}
.box.t-active{border-color:var(--active-bd);border-top:3px solid var(--active-fg)}
.box.t-wait{border-style:dashed}
.big{font-size:16px;font-weight:600;margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:4px 0 0}
.kv dt{color:var(--muted);font-size:12px;padding-top:1px}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv ul{margin:0;padding-left:16px}
.block{margin:20px 0}
.block>h2{font-size:15px;margin-bottom:8px}
.warn{background:var(--panel);border:1px solid var(--warn-bd);border-left:4px solid var(--warn-fg);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.warn ul{margin:4px 0 0;padding-left:18px}
.verbatim{white-space:pre-wrap;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:13px}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.apply{display:flex;gap:8px;align-items:flex-start;margin-top:8px;flex-wrap:wrap}
.apply code{flex:1 1 320px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;user-select:all}
.view{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;max-height:70vh;overflow:auto}
.add{color:var(--ok-fg)}.del{color:var(--bad-fg)}.hunk{color:var(--muted)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0}
.msg .verbatim{margin-top:4px;font-size:14px}
.ev{display:grid;grid-template-columns:72px 92px minmax(0,1fr);gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.art-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12px;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.list{position:static;max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
.grid{grid-template-columns:1fr}.ev{grid-template-columns:64px minmax(0,1fr)}.ev .k{display:none}.topbar,.banner{padding-left:14px;padding-right:14px}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}
</style></head><body>
<header class="topbar">
  <span class="brand">Claude 协作工作台</span><span class="muted">只读 · 插件只报告事实，裁决由 Codex 做出</span>
  <span class="spacer"></span><span id="updated" class="muted"></span><span id="conn" class="pill">连接中</span>
</header>
<div id="banner" class="banner" role="status" hidden></div>
<div class="layout">
  <nav class="list" aria-label="任务列表">
    <div class="list-head"><span class="muted">任务</span><span id="listMeta" class="muted"></span></div>
    <div id="taskList"></div>
    <button id="moreRuns" type="button" hidden>加载更早的记录</button>
  </nav>
  <main class="detail"><div class="inner">
    <div id="empty" class="empty"><h1>还没有选中任务</h1><p>从 Codex 派发任务后，在这里查看运行事实、Claude 自称和 Codex 裁决。</p></div>
    <article id="runView" hidden>
      <div id="roundTabs" class="tabs" role="tablist" aria-label="轮次"></div>
      <h1 id="runTitle" class="title"></h1>
      <div id="runFacts" class="facts"></div>
      <p id="runError" class="banner auth" hidden></p>
      <div id="runBody" hidden>
        <div class="grid">
          <section id="boxRun" class="box"></section>
          <section id="boxClaim" class="box"></section>
          <section id="boxDecision" class="box"></section>
        </div>
        <section class="block"><h2>提醒</h2><div id="warnList"></div></section>
        <section class="block"><h2>改动</h2><div id="changeBody"></div></section>
        <section class="block"><h2>原始材料</h2>
          <div id="artTabs" class="tabs" role="tablist" aria-label="原始材料"></div>
          <div id="artMeta" class="art-meta"></div>
          <div id="artBody"></div>
          <button id="artMore" type="button" hidden>加载更多</button>
        </section>
      </div>
    </article>
  </div></main>
</div>
<script>
'use strict';
const PAGE_BYTES = 200000, RUN_PAGE = 100, MAX_EVENTS = 5000, SHOWN_EVENTS = 500;
const L = {
  status: {running: '运行中', ok: '正常结束', timeout: '超时', cancelled: '已取消', crashed: '异常退出', not_started: '未启动', lost: '失联'},
  verdict: {accepted: '采纳', accepted_with_corrections: '修正后采纳', rejected: '不采纳'},
  next: {done: '任务完成', next_round: '需要下一轮', codex_finishes: '由 Codex 收尾'},
  claim: {completed: '已完成', partial: '部分完成', blocked: '受阻'},
  stop: {confirmed: '已确认停止', stopped: '已停止', not_launched: '进程未启动', unknown: '未能确认停止'},
  kind: {implement: '实现', analyze: '分析'},
  profile: {copy: '独立副本', readonly: '只读'},
  cls: {in_scope: '范围内', outside_hint: '超出预期范围', protected: '受保护'},
  file: {A: '新增', M: '修改', D: '删除', R: '重命名', C: '复制', T: '类型变化'},
  item: {accepted: '采纳', downgraded: '降级', rejected: '不采纳'},
  source: {human: '用户本人', relayed: '他人转述'},
  warn: {
    original_changed_during_run: '运行期间原工作区有变动', protected_touched: '改动了受保护路径',
    outside_hint: '改动超出预期范围', tool_denied: '有工具调用被拒绝', source_not_read: '有原件未被读取',
    workflow_incomplete: '工作流未完成', report_missing: '缺少报告', result_missing: '缺少结果头',
    result_malformed: '结果头格式不合规', residual_processes_stopped: '已清理残留进程',
    process_stop_unconfirmed: '无法确认进程已停止', sensitive_inputs_skipped: '部分原件未复制给 Claude',
    resume_fallback: '未能续接上一轮会话', questions_for_user: 'Claude 有需要用户决定的问题',
    disputes_present: 'Claude 提出异议', not_verified_present: 'Claude 列出未验证的内容',
    provider_error: '模型服务返回错误', patch_unavailable: '无法生成补丁',
    carried_already_in_original: '此前的待交付改动已在原仓库中', finalize_error: '结果汇总不完整，请看原始材料',
    undelivered_files_now_ignored: '待交付文件已被原仓库的忽略规则匹配'},
};
const ARTS = [['report', '报告'], ['brief', 'Claude 收到的任务书'], ['result', '结果头'], ['patch', 'Patch'],
  ['delivery_patch', '待交付 Patch'], ['packet', '用户原话'], ['inputs', '原件'], ['instruction_layer', '指令层'],
  ['final_message', '最终回复'], ['events', '活动']];
const JSON_ARTS = new Set(['result', 'packet', 'inputs', 'instruction_layer']);

const hashParams = new URLSearchParams(location.hash.slice(1));
const S = {
  token: hashParams.get('token') || '', sel: hashParams.get('run') || '', runs: new Map(), pageEnd: 0, hasMore: false,
  listLoaded: false, listSeq: 0, listApplied: 0, listSig: '', snap: null, runSig: '', tabSig: '', runError: '', gen: 0,
  events: [], cursor: 0, evTrimmed: false, artName: '', art: null, artSeq: 0, timers: {}, dead: false, conn: '',
};

const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

function el(tag, cls, ...kids) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  for (const kid of kids) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
function label(map, key, fallback) {
  if (key === null || key === undefined || key === '') return fallback === undefined ? '—' : fallback;
  return Object.hasOwn(map, key) ? map[key] : String(key);
}
const warnLabel = code => label(L.warn, code, '未命名提醒');
function fill(node, ...kids) { node.replaceChildren(...kids.filter(Boolean)); }
function badge(text, tone) { return el('span', 'badge' + (tone ? ' ' + tone : ''), text); }
function list(items, cls) { return el('ul', cls, ...items.map(item => el('li', null, item))); }
function kv(rows) {
  const dl = el('dl', 'kv');
  for (const [key, value] of rows) if (value !== undefined && value !== null && value !== '') dl.append(el('dt', null, key), el('dd', null, value));
  return dl;
}
function table(heads, rows) {
  const head = el('tr', null, ...heads.map(h => el('th', null, h)));
  const body = el('tbody', null, ...rows.map(cells => el('tr', null, ...cells.map(c => el('td', null, c)))));
  return el('div', 'scroll', el('table', null, el('thead', null, head), body));
}
function fmtDur(s) {
  if (typeof s !== 'number' || !isFinite(s)) return '—';
  if (s < 60) return s.toFixed(1) + ' 秒';
  const m = Math.floor(s / 60);
  return m < 60 ? `${m} 分 ${Math.round(s % 60)} 秒` : `${Math.floor(m / 60)} 小时 ${m % 60} 分`;
}
function fmtTime(sec, clockOnly) {
  if (typeof sec !== 'number' || !isFinite(sec)) return '—';
  const d = new Date(sec * 1000);
  return clockOnly ? d.toLocaleTimeString('zh-CN', {hour12: false}) : d.toLocaleString('zh-CN', {hour12: false});
}
function fmtBytes(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '—';
  return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
}

const statusText = r => label(L.status, r && r.status, '状态未知');
function statusTone(status) {
  if (status === 'running') return 't-active pulse';
  if (status === 'timeout' || status === 'crashed' || status === 'lost') return 't-bad';
  if (status === 'cancelled' || status === 'not_started') return 't-warn';
  return '';
}
function verdictText(decision) {
  if (!decision || !decision.verdict) return '待核验';
  return label(L.verdict, decision.verdict) + ' · ' + label(L.next, decision.next, '下一步未注明');
}
function verdictTone(decision) {
  if (!decision || !decision.verdict) return 't-wait';
  return {accepted: 't-ok', accepted_with_corrections: 't-warn', rejected: 't-bad'}[decision.verdict] || '';
}

function groupTasks(runs) {
  const byTask = new Map();
  for (const r of runs) {
    if (!r || !r.run_id) continue;
    const key = String(r.task_id ?? r.run_id);
    if (!byTask.has(key)) byTask.set(key, []);
    byTask.get(key).push(r);
  }
  const groups = [...byTask].map(([taskId, rows]) => {
    rows.sort((a, b) => (a.round || 0) - (b.round || 0) || (a.started_at || 0) - (b.started_at || 0));
    const latest = rows.reduce((best, r) => ((r.started_at || 0) >= (best.started_at || 0) ? r : best));
    const activity = Math.max(...rows.map(r => Math.max(r.started_at || 0, r.updated_at || 0, r.ended_at || 0,
      (r.decision && r.decision.recorded_at) || 0)));
    return {task_id: taskId, runs: rows, latest, activity};
  });
  return groups.sort((a, b) => b.activity - a.activity || (a.task_id < b.task_id ? -1 : 1));
}

class ApiError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
async function api(path) {
  let res;
  try {
    res = await fetch(path, {headers: {Authorization: 'Bearer ' + S.token}, cache: 'no-store'});
  } catch (error) {
    setConn('down', '无法连接本机工作台');
    throw new ApiError(0, '无法连接本机工作台');
  }
  let body = null;
  try { body = await res.json(); } catch (error) { body = null; }
  if (res.status === 401) {
    setConn('auth');
    throw new ApiError(401, '链接失效');
  }
  const message = (body && typeof body.error === 'string' && body.error) || ('HTTP ' + res.status);
  if (res.status >= 500) {
    setConn('down', '工作台服务出错：' + message);
    throw new ApiError(res.status, message);
  }
  setConn('ok');
  if (!res.ok) throw new ApiError(res.status, message);
  return body;
}
function setConn(state, detail) {
  if (S.conn === 'auth') return;
  S.conn = state;
  if (state === 'auth') {
    S.dead = true;
    for (const key of Object.keys(S.timers)) clearTimeout(S.timers[key]);
  }
  const banner = $('banner');
  banner.hidden = state === 'ok';
  banner.className = 'banner' + (state === 'auth' ? ' auth' : '');
  banner.textContent = state === 'auth' ? '链接失效，请从 Codex 重新获取' : state === 'down' ? '连接中断，正在重试' + (detail ? '：' + detail : '') : '';
  const pill = $('conn');
  pill.className = 'pill' + (state === 'ok' ? '' : ' ' + state);
  pill.textContent = {ok: '已连接', down: '连接中断', auth: '链接失效'}[state];
  if (state === 'ok') $('updated').textContent = '更新于 ' + fmtTime(Date.now() / 1000, true);
}

function later(key, fn, ms) {
  clearTimeout(S.timers[key]);
  if (!S.dead) S.timers[key] = setTimeout(fn, ms);
}
async function listLoop() {
  await refreshList(false);
  later('list', listLoop, document.hidden ? 30000 : 5000);
}
async function runLoop() {
  if (!S.sel || S.dead) return;
  await refreshRun();
  const active = !S.snap || S.snap.active;
  later('run', runLoop, document.hidden ? (active ? 15000 : 60000) : (active ? 2000 : 10000));
}

function mergeRun(row) {
  const old = S.runs.get(row.run_id);
  if (old && (old.updated_at || 0) > (row.updated_at || 0)) return;
  S.runs.set(row.run_id, Object.assign({}, old, row));
}
async function refreshList(more) {
  const seq = ++S.listSeq;
  const offset = more ? S.pageEnd : 0;
  const limit = more ? RUN_PAGE : Math.min(200, Math.max(RUN_PAGE, S.pageEnd));
  try {
    const data = await api(`/api/runs?limit=${limit}&offset=${offset}`);
    if (!more && seq < S.listApplied) return;
    if (!more) S.listApplied = seq;
    for (const row of data.runs || []) mergeRun(row);
    if (more || S.pageEnd <= limit) {
      S.pageEnd = Math.max(S.pageEnd, data.next_offset || 0);
      S.hasMore = !!data.has_more;
    }
    S.listLoaded = true;
  } catch (error) {
    return;
  }
  renderList();
  if (!S.sel) {
    const first = groupTasks([...S.runs.values()])[0];
    if (first) selectRun(first.latest.run_id);
  }
}

function selectRun(id) {
  if (!id || (id === S.sel && S.snap && S.snap.run_id === id)) return;
  S.sel = id;
  S.gen++;
  S.artSeq++;
  Object.assign(S, {snap: null, runSig: '', runError: '', events: [], cursor: 0, evTrimmed: false, art: null});
  history.replaceState(null, '', '#token=' + enc(S.token) + '&run=' + enc(id));
  clearTimeout(S.timers.run);
  renderList();
  renderRun();
  runLoop();
}
async function refreshRun() {
  const id = S.sel, gen = S.gen;
  let snap;
  try {
    snap = await api('/api/snapshot?run_id=' + enc(id));
  } catch (error) {
    if (gen === S.gen && error.status >= 400 && error.status < 500 && error.status !== 401) {
      S.runError = '无法读取这一轮：' + error.message;
      renderRun();
    }
    return;
  }
  if (gen !== S.gen) return;
  const prev = S.snap;
  S.snap = snap;
  S.runError = '';
  mergeRun(snap);
  if (!S.artName) S.artName = snap.active ? 'events' : 'report';
  renderList();
  renderRun();
  const justFinished = prev && prev.active && !snap.active;
  if (S.artName !== 'events' && (!S.art || justFinished)) loadArtifact(S.artName, false);
  const lastSeq = snap.last_event && typeof snap.last_event.seq === 'number' ? snap.last_event.seq : 0;
  if (lastSeq > S.cursor) await loadEvents(gen);
}
async function loadEvents(gen) {
  for (let page = 0; page < 10; page++) {
    let data;
    try {
      data = await api(`/api/events?run_id=${enc(S.sel)}&after=${S.cursor}&limit=200`);
    } catch (error) {
      return;
    }
    if (gen !== S.gen) return;
    const fresh = (data.events || []).filter(e => typeof e.seq === 'number' && e.seq > S.cursor);
    S.events.push(...fresh);
    if (S.events.length > MAX_EVENTS) {
      S.events.splice(0, S.events.length - MAX_EVENTS);
      S.evTrimmed = true;
    }
    S.cursor = Math.max(S.cursor, data.next_cursor || 0, ...fresh.map(e => e.seq));
    if (!data.has_more || !fresh.length) break;
  }
  if (S.artName === 'events') renderArtifact();
}
async function loadArtifact(name, more) {
  const run = S.sel, gen = S.gen, seq = ++S.artSeq;
  if (!more || !S.art || S.art.name !== name) S.art = {name, parts: [], next: 0, end: false, loading: true};
  const art = S.art;
  art.loading = true;
  art.error = '';
  renderArtifact();
  try {
    const data = await api(`/api/artifact?run_id=${enc(run)}&name=${enc(name)}&offset=${art.next}&limit=${PAGE_BYTES}`);
    if (gen !== S.gen || seq !== S.artSeq) return;
    art.available = !!data.available;
    if (art.available) {
      Object.assign(art, {size: data.size_bytes, sha: data.sha256, next: data.next_offset, end: !!data.end_of_artifact});
      if (typeof data.content === 'string') art.parts.push(data.content);
      else art.json = data.content;
    }
  } catch (error) {
    if (gen !== S.gen || seq !== S.artSeq) return;
    art.error = error.message;
  }
  art.loading = false;
  renderArtifact();
}
function openArtifact(name) {
  S.artName = name;
  S.artSeq++;
  S.art = null;
  if (name === 'events') renderArtifact();
  else loadArtifact(name, false);
}

function renderList() {
  const groups = groupTasks([...S.runs.values()]);
  const sig = JSON.stringify([S.sel, S.hasMore, S.listLoaded, groups.map(g => [g.task_id, g.runs.length, g.latest.run_id,
    g.latest.status, g.latest.title, g.latest.decision && [g.latest.decision.verdict, g.latest.decision.next]])]);
  if (sig === S.listSig) return;
  S.listSig = sig;
  const box = $('taskList');
  if (!groups.length) box.replaceChildren(el('p', 'muted', S.listLoaded ? '还没有任务记录。' : '正在读取任务…'));
  else box.replaceChildren(...groups.map(taskCard));
  $('moreRuns').hidden = !S.hasMore;
  $('listMeta').textContent = groups.length ? `${groups.length} 个` + (S.hasMore ? '（仅已载入）' : '') : '';
}
function taskCard(group) {
  const r = group.latest;
  const card = el('button', 'card',
    el('div', 'card-title', r.title || group.task_id),
    el('div', 'muted', `${group.task_id} · ${label(L.kind, r.kind)} / ${label(L.profile, r.profile)} · 第 ${r.round ?? '?'} 轮`
      + (group.runs.length > 1 ? `（已载入 ${group.runs.length} 轮）` : '')),
    el('div', 'badges', badge(statusText(r), statusTone(r.status)), badge(verdictText(r.decision), verdictTone(r.decision))));
  card.type = 'button';
  card.setAttribute('aria-current', String(group.runs.some(x => x.run_id === S.sel)));
  card.addEventListener('click', () => selectRun(r.run_id));
  return card;
}

function renderRun() {
  $('empty').hidden = !!S.sel;
  $('runView').hidden = !S.sel;
  if (!S.sel) return;
  const s = S.snap;
  const err = $('runError');
  err.hidden = !S.runError;
  err.textContent = S.runError;
  $('runBody').hidden = !s;
  if (!s) {
    $('roundTabs').replaceChildren();
    S.tabSig = '';
    $('runTitle').textContent = S.runError ? S.sel : '正在读取 ' + S.sel + ' …';
    $('runFacts').replaceChildren();
    return;
  }
  const o = s.outcome || null;
  renderHeader(s, o);
  const sig = JSON.stringify([s.run_id, s.status, s.decision, o, s.live, s.decision_history_count,
    s.active && s.last_meaningful_event && s.last_meaningful_event.seq]);
  if (sig === S.runSig) return;
  S.runSig = sig;
  renderBoxes(s, o);
  renderWarnings(s, o);
  renderChanges(s, o);
  renderArtTabs();
  if (!S.art && S.artName === 'events') renderArtifact();
}
function renderHeader(s, o) {
  const group = groupTasks([...S.runs.values()].filter(r => r.task_id === s.task_id))[0];
  const runs = group ? group.runs : [s];
  const tabSig = JSON.stringify([s.run_id, runs.map(r => [r.run_id, r.round, r.status, r.decision && r.decision.verdict])]);
  if (tabSig !== S.tabSig) {
    S.tabSig = tabSig;
    $('roundTabs').replaceChildren(...runs.map(roundTab));
  }
  $('runTitle').textContent = s.title || s.task_id || s.run_id;
  const actual = o ? (o.models || []).join(', ') : s.live ? ((s.live.models || []).join(', ') || s.live.initialized_model) : '';
  const fact = (key, value) => el('span', null, key + ' ', el('b', null, value));
  const facts = [fact('任务', s.task_id ?? '—'), fact('运行', s.run_id),
    fact('类型', `${label(L.kind, s.kind)} / ${label(L.profile, s.profile)} · 第 ${s.round ?? '?'} 轮`),
    fact('模型', `请求 ${s.model || '—'} · effort ${s.effort || '—'} · 实际 ${actual || '待回报'}`),
    fact('用时', fmtDur(s.elapsed_seconds) + (s.active && s.timeout_seconds ? ' / 上限 ' + fmtDur(s.timeout_seconds) : '')),
    fact('开始', fmtTime(s.started_at))];
  if (s.continue_from) {
    const link = el('button', 'link', s.continue_from);
    link.type = 'button';
    link.addEventListener('click', () => selectRun(s.continue_from));
    facts.push(el('span', null, '接续自 ', link));
  }
  $('runFacts').replaceChildren(...facts);
}
function roundTab(r, index, runs) {
  const twin = runs.filter(x => x.round === r.round).length > 1;
  const tag = r.status === 'running' ? '运行中' : r.decision ? label(L.verdict, r.decision.verdict) : '待核验';
  const tab = el('button', 'tab', `第 ${r.round ?? '?'} 轮` + (twin ? ' · ' + r.run_id.slice(-4) : '') + ' · ' + tag);
  tab.type = 'button';
  tab.setAttribute('role', 'tab');
  tab.setAttribute('aria-selected', String(r.run_id === S.sel));
  tab.addEventListener('click', () => selectRun(r.run_id));
  return tab;
}
function renderBoxes(s, o) {
  const running = s.status === 'running';
  const stopped = (o && o.process_stopped) || s.process_stopped;
  const last = s.last_meaningful_event;
  const cost = o && typeof o.cost_usd === 'number' ? '$' + o.cost_usd.toFixed(4) + '（CLI 估算）' : '—';
  const boxRun = $('boxRun');
  boxRun.className = 'box ' + (statusTone(s.status).replace(' pulse', '') || '');
  boxRun.replaceChildren(el('h2', null, '运行事实'), el('p', 'big', statusText(s)), kv([
    ['最近活动', running && last ? last.summary : undefined],
    ['进程', running ? '运行中' : label(L.stop, stopped, '未记录')],
    ['耗时', o ? fmtDur(o.duration_seconds) : fmtDur(s.elapsed_seconds) + (running ? '（进行中）' : '')],
    ['费用', running ? '运行结束后汇总' : cost],
    ['说明', o && o.note ? o.note : undefined]]));
  const claimed = o ? o.claimed_status : s.claimed_status;
  const summary = (o && o.summary) || s.summary;
  fill($('boxClaim'), el('h2', null, 'Claude 自称'),
    el('p', 'big', claimed ? label(L.claim, claimed) : running ? '运行中，尚未回报' : '未给出（结果头缺失或无效）'),
    summary ? el('p', 'verbatim', summary) : null,
    el('p', 'muted', '这是 Claude 自己的说法，不是核验结论。'));
  const d = s.decision;
  const boxDecision = $('boxDecision');
  boxDecision.className = 'box ' + verdictTone(d);
  if (!d || !d.verdict) {
    boxDecision.replaceChildren(el('h2', null, 'Codex 裁决'), el('p', 'big', '尚未核验'),
      el('p', 'muted', running ? '运行结束后由 Codex 核验。' : 'Codex 还没有给出裁决；运行事实和 Claude 自称都不等于验收。'));
    return;
  }
  const items = (d.item_decisions || []).map(x => `${x.id}：${label(L.item, x.disposition)}`);
  boxDecision.replaceChildren(el('h2', null, 'Codex 裁决'), el('p', 'big', '报告：' + label(L.verdict, d.verdict)), kv([
    ['下一步', label(L.next, d.next, '未注明')],
    ['说明', d.note ? el('span', 'verbatim', d.note) : undefined],
    ['核验依据', d.evidence && d.evidence.length ? list(d.evidence) : '未列出'],
    ['逐项', items.length ? list(items) : undefined],
    ['已确认受保护路径', d.protected_confirmed && d.protected_confirmed.length ? list(d.protected_confirmed, 'mono') : undefined],
    ['记录于', fmtTime(d.recorded_at)],
    ['历史', s.decision_history_count > 1 ? `共 ${s.decision_history_count} 次裁决，显示最新一次` : undefined]]));
}
function renderWarnings(s, o) {
  const raw = o ? (o.warnings || []) : (s.warnings || []);
  const warnings = raw.map(w => (typeof w === 'string' ? {code: w} : w || {}));
  const box = $('warnList');
  if (!warnings.length) {
    box.replaceChildren(el('p', 'muted', s.status === 'running' ? '运行结束后汇总提醒。' : '没有提醒。'));
    return;
  }
  box.replaceChildren(...warnings.map(w => el('div', 'warn',
    el('div', null, el('b', null, warnLabel(w.code)), ' ', el('code', 'muted', w.code || '')),
    w.detail ? el('p', 'muted verbatim', w.detail) : null,
    Array.isArray(w.paths) && w.paths.length ? list(w.paths.map(String), 'mono') : null,
    Array.isArray(w.items) && w.items.length ? list(w.items.map(item => el('span', 'verbatim', String(item)))) : null)));
}
function renderChanges(s, o) {
  const box = $('changeBody');
  if (!o) {
    box.replaceChildren(el('p', 'muted', s.status === 'running' ? '运行结束后生成改动清单。' : '没有运行结果记录。'));
    return;
  }
  const c = o.changes;
  if (!c) {
    box.replaceChildren(el('p', 'muted', s.profile === 'readonly' ? '只读运行，没有改动。' : '没有改动记录。'));
    return;
  }
  const files = Array.isArray(c.files) ? c.files : [];
  const tone = {in_scope: '', outside_hint: 't-warn', protected: 't-bad'};
  const parts = [el('p', null, `${c.file_count ?? files.length} 个文件 · +${c.insertions ?? 0} −${c.deletions ?? 0}`)];
  if (files.length) {
    parts.push(table(['文件', '变化', '行数', '归类'], files.map(f => [el('code', null, f.path || '—'), label(L.file, f.status),
      `+${f.insertions ?? 0} −${f.deletions ?? 0}`, badge(label(L.cls, f['class'], '未归类'), tone[f['class']] || '')])));
  }
  if (c.apply_hint) {
    const note = el('span', 'muted');
    const button = el('button', null, '复制命令');
    button.type = 'button';
    const command = c.check_hint ? `${c.check_hint} && ${c.apply_hint}` : c.apply_hint;
    button.addEventListener('click', () => copyText(command, note));
    parts.push(el('p', 'muted', '把待交付补丁先检查再应用到原工作区（由你或 Codex 决定是否执行）：'),
      el('div', 'apply', el('code', null, command), button, note));
  }
  if (c.delivery_patch) parts.push(el('p', 'muted', `待交付补丁含此前尚未应用到原仓库的全部改动（${c.delivery_file_count ?? 0} 个文件），见原始材料“待交付 Patch”。`));
  box.replaceChildren(...parts);
}
function copyText(text, note) {
  const done = message => { note.textContent = message; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done('已复制'), () => done('复制失败，请手动选中命令'));
  } else {
    done('浏览器不支持自动复制，请手动选中命令');
  }
}

function renderArtTabs() {
  const o = S.snap && S.snap.outcome;
  const shown = ARTS.filter(([name]) => name !== 'delivery_patch' || (o && o.changes && o.changes.delivery_patch));
  $('artTabs').replaceChildren(...shown.map(([name, text]) => {
    const tab = el('button', 'tab', text);
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', String(name === S.artName));
    tab.addEventListener('click', () => openArtifact(name));
    return tab;
  }));
}
function renderArtifact() {
  renderArtTabs();
  const meta = $('artMeta'), body = $('artBody'), more = $('artMore');
  more.hidden = true;
  if (S.artName === 'events') {
    meta.replaceChildren(el('span', null, `共 ${S.events.length} 条公开活动`
      + (S.evTrimmed ? `（早于这些的活动已丢弃，只保留最近 ${MAX_EVENTS} 条）` : '')));
    body.replaceChildren(eventsView());
    return;
  }
  const a = S.art;
  if (!a) { meta.replaceChildren(); body.replaceChildren(); return; }
  if (a.error && !a.parts.length && a.json === undefined) {
    meta.replaceChildren();
    body.replaceChildren(el('p', 'muted', '读取失败：' + a.error));
    return;
  }
  if (a.available === false) {
    meta.replaceChildren();
    body.replaceChildren(el('p', 'muted', S.snap && S.snap.active ? '运行中，这份材料还没有生成。' : '本轮没有这份材料。'));
    return;
  }
  if (a.available === undefined) {
    meta.replaceChildren();
    body.replaceChildren(el('p', 'muted', '正在读取…'));
    return;
  }
  const o = S.snap && S.snap.outcome;
  const recorded = o ? {report: o.report && o.report.sha256, brief: o.brief && o.brief.sha256}[a.name] : null;
  fill(meta,
    a.name === 'brief' ? el('b', null, 'Claude 实际收到的任务书') : null,
    el('span', null, `大小 ${fmtBytes(a.size)} · 已载入 ${fmtBytes(a.next)}`),
    el('span', null, 'sha256 ', el('code', null, a.sha || '—')),
    recorded ? el('span', null, recorded === a.sha ? '与运行记录一致' : '与运行记录的 sha256 不一致') : null,
    a.error ? el('span', null, '继续读取失败：' + a.error) : null);
  if (!a.end) {
    more.hidden = false;
    more.disabled = !!a.loading;
    more.textContent = a.loading ? '加载中…' : `加载更多（${fmtBytes(a.next)} / ${fmtBytes(a.size)}）`;
  }
  body.replaceChildren(artView(a));
}
function artView(a) {
  const text = a.parts.join('');
  let data = a.json;
  if (data === undefined && a.end && JSON_ARTS.has(a.name)) {
    try { data = JSON.parse(text); } catch (error) { data = undefined; }
  }
  if (data !== undefined && data !== null && typeof data === 'object') {
    if (a.name === 'packet') return packetView(data);
    if (a.name === 'inputs') return inputsView(data);
    if (a.name === 'instruction_layer') return layerView(data);
    return el('pre', 'view', JSON.stringify(data, null, 2));
  }
  if (data !== undefined) return el('pre', 'view', JSON.stringify(data));
  if (a.name === 'patch' || a.name === 'delivery_patch') return diffView(text);
  return el('pre', 'view', text);
}
function diffView(text) {
  const pre = el('pre', 'view');
  const lines = text.split('\n');
  if (lines.length > 6000) {
    pre.append(document.createTextNode(text));
    return pre;
  }
  lines.forEach((line, i) => {
    const content = line + (i < lines.length - 1 ? '\n' : '');
    const cls = /^(\+\+\+|---)( |$)|^@@|^diff /.test(line) ? 'hunk' : line[0] === '+' ? 'add' : line[0] === '-' ? 'del' : '';
    pre.append(cls ? el('span', cls, content) : document.createTextNode(content));
  });
  return pre;
}
function packetView(p) {
  const msgs = Array.isArray(p.user_messages) ? p.user_messages : [];
  const box = el('div', null, el('p', 'muted', '逐字展示 Codex 转交给 Claude 的用户原话，未经改写。'));
  msgs.forEach((m, i) => {
    const head = `第 ${i + 1} 条 · ${label(L.source, m && m.source, '来源未注明')}` + (m && m.at ? ' · ' + m.at : '');
    box.append(el('div', 'msg', el('div', 'muted', head), el('div', 'verbatim', String((m && m.text) ?? ''))));
  });
  if (!msgs.length) {
    box.append(el('div', 'msg', el('div', 'muted', '没有用户原话。Codex 给出的原因：'),
      el('div', 'verbatim', p.no_user_words_reason == null ? '（未提供原因）' : String(p.no_user_words_reason))));
  }
  return box;
}
function inputsView(d) {
  const entries = Array.isArray(d.inputs) ? d.inputs : [];
  const skipped = Array.isArray(d.skipped) ? d.skipped : [];
  const box = el('div', null, el('p', 'muted', '运行开始时冻结给 Claude 的原件副本。'));
  if (!entries.length) box.append(el('p', 'muted', '本轮没有原件。'));
  else box.append(table(['原路径', '类型', '大小', 'sha256'], entries.map(x => [el('code', null, x.original || x.copy || '—'),
    x.kind === 'directory' ? `目录 · ${x.files ?? 0} 个文件` : '文件', fmtBytes(x.bytes), el('code', null, x.sha256 || '—')])));
  if (skipped.length) box.append(el('p', null, '未复制给 Claude：'), list(skipped.map(String), 'mono'));
  return box;
}
function layerView(d) {
  const files = Array.isArray(d.files) ? d.files : [];
  const hooks = Array.isArray(d.hooks) ? d.hooks : [];
  const o = S.snap && S.snap.outcome;
  const plugins = (o && o.instruction_layer && o.instruction_layer.plugins) || [];
  const box = el('div', null, el('p', 'muted', '除任务书外，Claude 会话按默认设置加载的指令文件、hooks 与插件（只列出，不修改）。'));
  box.append(el('h3', null, `指令文件（${files.length}）`));
  if (files.length) box.append(table(['路径', '范围', '大小', 'sha256'], files.map(f => [el('code', null, f.path || '—'), f.scope || '—',
    f.readable === false ? '不可读' : fmtBytes(f.bytes), el('code', null, f.sha256 || '—')])));
  box.append(el('h3', null, `Hooks（${hooks.length}）`));
  if (hooks.length) box.append(list(hooks.map(h => el('code', null, [h.source, h.event, h.matcher, h.command || h.note].filter(Boolean).join(' · ')))));
  box.append(el('h3', null, `插件（${plugins.length}）`), plugins.length ? list(plugins.map(String)) : el('p', 'muted', '会话未报告插件。'));
  if (d.note) box.append(el('p', 'muted verbatim', d.note));
  return box;
}
function eventsView() {
  if (!S.events.length) return el('p', 'muted', S.snap && S.snap.active ? '等待第一条活动…' : '没有活动记录。');
  const shown = S.events.slice(-SHOWN_EVENTS);
  const box = el('div', null);
  if (shown.length < S.events.length) box.append(el('p', 'muted', `只显示最近 ${SHOWN_EVENTS} 条。`));
  for (const e of shown) {
    const extra = [e.status, e.tool, e.file].filter(Boolean).join(' · ');
    box.append(el('div', 'ev', el('span', 'muted', fmtTime(e.received_at, true)), el('span', 'k muted', e.kind || ''),
      el('div', null, el('span', null, e.summary || ''), extra ? el('span', 'muted', ' · ' + extra) : null,
        e.text ? el('div', 'muted verbatim', e.text) : null)));
  }
  return box;
}

function boot() {
  $('moreRuns').addEventListener('click', () => refreshList(true));
  $('artMore').addEventListener('click', () => {
    if (S.art && !S.art.loading && !S.art.end) loadArtifact(S.art.name, true);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || S.dead) return;
    listLoop();
    runLoop();
  });
  window.addEventListener('hashchange', () => {
    const params = new URLSearchParams(location.hash.slice(1));
    if ((params.get('token') || '') !== S.token) location.reload();
    else if (params.get('run')) selectRun(params.get('run'));
  });
  renderList();
  renderRun();
  if (!S.token) {
    setConn('auth');
    return;
  }
  listLoop();
  if (S.sel) {
    const id = S.sel;
    S.sel = '';
    selectRun(id);
  }
}
boot();
