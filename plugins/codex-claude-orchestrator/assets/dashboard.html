<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Claude 工作台</title>
<style>
:root{color-scheme:light dark;
--bg:#F5F5F7;--bg2:#FBFBFD;--panel:#FFFFFF;--line:#E2E2E7;--text:#1D1D1F;--muted:#6E6E73;--focus:#0A66D8;
--active-fg:#0A62CC;--active-bg:#EAF2FD;--active-bd:#B9D3F5;--ok-fg:#1B7A4B;--ok-bg:#E8F5EE;--ok-bd:#B5DCC6;
--warn-fg:#A35200;--warn-bg:#FDF3E6;--warn-bd:#EFCB9C;--bad-fg:#B3261E;--bad-bg:#FCECEA;--bad-bd:#EEBDB8;
--plain-fg:#3A3A3C;--plain-bg:#F2F2F5;--plain-bd:#D2D2D7;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);--scrim:rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){:root{
--bg:#161618;--bg2:#1C1C1E;--panel:#232326;--line:#38383C;--text:#F5F5F7;--muted:#A1A1A6;--focus:#8AB4FF;
--active-fg:#8AB4FF;--active-bg:#1B2840;--active-bd:#34507F;--ok-fg:#7FD3A8;--ok-bg:#16302A;--ok-bd:#2F6B50;
--warn-fg:#FFC870;--warn-bg:#3A2A10;--warn-bd:#8A6424;--bad-fg:#FFB0A6;--bad-bg:#3D1D1A;--bad-bd:#8C4A42;
--plain-fg:#D5D7DB;--plain-bg:#2A2A2D;--plain-bd:#4A4A4F;--shadow:0 1px 2px rgba(0,0,0,.3);--scrim:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 12px}
button:hover{border-color:var(--plain-bd)}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
code,pre,.mono{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:12px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:48px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{font-weight:600;font-size:15px;white-space:nowrap}.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.spacer{flex:1}
.switch{display:none;align-items:center;gap:6px;font-weight:600;padding:3px 10px}.switch .count{font-size:12px;font-weight:500;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--plain-bd)}
.pill.ok::before{background:var(--ok-fg)}.pill.down::before{background:var(--warn-fg)}.pill.auth::before{background:var(--bad-fg)}
.banner{padding:9px 20px;font-size:13px;background:var(--warn-bg);color:var(--warn-fg);border-bottom:1px solid var(--warn-bd)}
.banner.auth{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-bd)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 48px)}
.list{border-right:1px solid var(--line);padding:12px 10px;overflow:auto;height:calc(100vh - 48px);position:sticky;top:48px;background:var(--bg)}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:2px 6px 10px;font-weight:600;font-size:13px}
.card{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;margin-bottom:4px;border-color:transparent;background:transparent}
.card:hover{background:var(--panel);border-color:var(--line)}
.card[aria-current=true]{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.card-title{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card-meta{margin:1px 0 6px}#moreRuns{width:100%;margin-top:4px}
.badge{display:inline-block;font-size:12px;line-height:1.6;border-radius:6px;padding:0 8px;border:1px solid var(--plain-bd);background:var(--plain-bg);color:var(--plain-fg);white-space:nowrap}
.t-active{color:var(--active-fg);background:var(--active-bg);border-color:var(--active-bd)}
.t-ok{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-bd)}
.t-warn{color:var(--warn-fg);background:var(--warn-bg);border-color:var(--warn-bd)}
.t-bad{color:var(--bad-fg);background:var(--bad-bg);border-color:var(--bad-bd)}.t-wait{border-style:dashed}.scrim{display:none}
.detail{padding:20px clamp(14px,4vw,40px) 64px;min-width:0}.inner{max-width:920px;margin:0 auto}
.empty{max-width:420px;margin:72px auto;text-align:center;color:var(--muted)}.empty h1{font-size:18px;color:var(--text);margin-bottom:6px}
.empty button{margin-top:14px;display:none}.rounds{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px}
.tab{white-space:nowrap;border-radius:999px;padding:2px 12px;font-size:13px}
.tab[aria-selected=true]{background:var(--text);color:var(--bg);border-color:var(--text)}.tab-break{flex-basis:100%;height:0}
.title{font-size:22px;line-height:1.35;font-weight:650;overflow-wrap:anywhere;margin:0 0 6px}
.facts{display:flex;flex-wrap:wrap;font-size:12px;color:var(--muted)}.facts>span:not(:last-child)::after{content:"·";margin:0 7px;opacity:.6}
.link{border:0;background:none;padding:0;color:var(--focus);font-size:inherit}
.hero{display:flex;gap:12px;align-items:flex-start;margin:16px 0 12px;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:8px;background:var(--plain-bd)}
.hero.t-active .dot{background:var(--active-fg)}.hero.t-ok .dot{background:var(--ok-fg)}
.hero.t-warn .dot{background:var(--warn-fg)}.hero.t-bad .dot{background:var(--bad-fg)}
.hero.t-wait:not(.t-bad):not(.t-warn) .dot{background:none;border:2px dashed var(--muted)}.hero h2{font-size:17px;font-weight:600;line-height:1.45}
.hero p{color:var(--muted);margin-top:2px}.hero.t-ok,.hero.t-warn,.hero.t-bad,.hero.t-active{color:var(--text);background:var(--panel)}
.hero.t-ok{border-color:var(--ok-bd)}.hero.t-warn{border-color:var(--warn-bd)}.hero.t-bad{border-color:var(--bad-bd)}.hero.t-active{border-color:var(--active-bd)}
.ask{margin:0 0 12px;padding:12px 16px;border-radius:12px;background:var(--active-bg);border:1px solid var(--active-bd)}
.ask h2{font-size:15px;color:var(--active-fg)}.ask ul{margin:6px 0 4px;padding-left:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}#boxDecision{grid-column:1/-1}#boxDecision.lead{order:-1}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.box h2{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:2px}
.box.t-ok,.box.t-warn,.box.t-bad,.box.t-active{color:var(--text);background:var(--panel)}
.box.t-ok{border-top:3px solid var(--ok-fg)}.box.t-warn{border-top:3px solid var(--warn-fg)}
.box.t-bad{border-top:3px solid var(--bad-fg)}.box.t-active{border-top:3px solid var(--active-fg)}.box.t-wait{border-style:dashed}
.big{font-size:16px;font-weight:600;margin-bottom:2px}.kv{margin:4px 0 0}.kv dt{color:var(--muted);font-size:12px;margin-top:6px}
.kv dd{margin:0;overflow-wrap:anywhere}.kv ul{margin:0;padding-left:18px}.block{margin:26px 0}.block>h2{font-size:15px;margin-bottom:8px}
.warn{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn-fg);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.warn ul{margin:4px 0 0;padding-left:18px}details>summary{cursor:pointer;color:var(--muted);font-size:12px;width:max-content}.tech{margin-top:4px}
.tech code{display:block;margin-top:2px}.verbatim{white-space:pre-wrap;overflow-wrap:anywhere}
.files{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:6px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:7px 12px;border-top:1px solid var(--line);font-size:13px}
.file:first-child{border-top:0}.file code{flex:1 1 200px;min-width:0}.apply-box{margin-top:12px}
.apply{display:flex;gap:8px;align-items:flex-start;margin-top:6px;flex-wrap:wrap}
.apply code{flex:1 1 260px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;user-select:all}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.art-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;font-size:12px;color:var(--muted)}.bad-text{color:var(--bad-fg)}
.view{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;max-height:70vh;overflow:auto}
.add{color:var(--ok-fg)}.del{color:var(--bad-fg)}.hunk{color:var(--muted)}.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:13px;margin:6px 0}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}h3{font-size:13px;margin:12px 0 4px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0}
.msg .verbatim{margin-top:4px;font-size:14px}
.ev{display:grid;grid-template-columns:70px 56px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.ids{margin-top:30px}.idrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:12px}
@media(max-width:899px){
.switch{display:inline-flex}.sub,#updated{display:none}.topbar{padding:0 14px}.layout{display:block}
.list{display:none;position:fixed;top:48px;left:0;right:0;height:auto;max-height:min(72vh,560px);z-index:25;border-right:0;border-bottom:1px solid var(--line);box-shadow:0 14px 32px rgba(0,0,0,.18)}
.layout.open .list{display:block}.layout.open .scrim{display:block;position:fixed;inset:48px 0 0 0;z-index:20;background:var(--scrim)}
.empty button{display:inline-block}.detail{padding-top:14px}.title{font-size:19px}
.ev{grid-template-columns:62px minmax(0,1fr)}.ev .k{display:none}}
@media(max-width:519px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}
</style></head><body>
<header class="topbar">
  <button id="listToggle" class="switch" type="button" aria-controls="taskNav" aria-expanded="false">任务 <span id="listCount" class="count"></span></button>
  <span class="brand">Claude 工作台</span><span class="sub muted">这里只看进度，验收交给 Codex</span>
  <span class="spacer"></span><span id="updated" class="muted"></span><span id="conn" class="pill">连接中</span>
</header>
<div id="banner" class="banner" role="status" hidden></div>
<div id="layout" class="layout">
  <nav id="taskNav" class="list" aria-label="任务列表">
    <div class="list-head"><span>全部任务</span><span id="listMeta" class="muted"></span></div>
    <div id="taskList"></div>
    <button id="moreRuns" type="button" hidden>加载更多</button>
  </nav>
  <div id="scrim" class="scrim"></div>
  <main class="detail"><div class="inner">
    <div id="empty" class="empty"><h1>选一个任务看看</h1><p>在 Codex 里派活后，进度会出现在这里</p>
      <button id="emptyOpen" type="button">打开任务列表</button></div>
    <article id="runView" hidden>
      <div id="roundTabs" class="rounds" role="tablist" aria-label="轮次"></div>
      <h1 id="runTitle" class="title"></h1>
      <div id="runFacts" class="facts"></div>
      <p id="runError" class="banner auth" hidden></p>
      <div id="runBody" hidden>
        <section id="hero" class="hero" aria-live="polite"></section>
        <div id="askBox"></div>
        <div class="grid">
          <section id="boxRun" class="box"></section>
          <section id="boxClaim" class="box"></section>
          <section id="boxDecision" class="box"></section>
        </div>
        <section class="block"><h2>提醒</h2><div id="warnList"></div></section>
        <section class="block"><h2>改动</h2><div id="changeBody"></div></section>
        <section class="block"><h2>详细资料</h2>
          <div id="artTabs" class="tabs" role="tablist" aria-label="详细资料"></div>
          <div id="artMeta" class="art-meta"></div>
          <div id="artBody"></div>
          <button id="artMore" type="button" hidden>加载更多</button>
        </section>
        <details class="ids"><summary>编号</summary><div id="idBody"></div></details>
      </div>
    </article>
  </div></main>
</div>
<script>
'use strict';
const PAGE_BYTES = 200000, RUN_PAGE = 100, MAX_EVENTS = 5000, SHOWN_EVENTS = 500;
const L = {
  status: {running: '进行中', ok: '正常结束', timeout: '超时', cancelled: '已取消', crashed: '意外中断', not_started: '未启动', lost: '失联'},
  verdict: {accepted: '通过', accepted_with_corrections: '改后通过', rejected: '退回'},
  next: {done: '已完成', next_round: '再做一轮', codex_finishes: 'Codex 收尾'},
  claim: {completed: '做完了', partial: '没做完', blocked: '卡住了'},
  stop: {confirmed: '已确认停止', stopped: '已停止', not_launched: '进程未启动', unknown: '未能确认停止'},
  kind: {implement: '动手改', analyze: '只分析'},
  profile: {copy: '副本模式', readonly: '只读模式'},
  cls: {in_scope: '预期内', outside_hint: '超出预期', protected: '受保护'},
  file: {A: '新增', M: '修改', D: '删除', R: '重命名', C: '复制', T: '类型变化'},
  item: {accepted: '采纳', downgraded: '降级', rejected: '不采纳'},
  source: {human: '你说的', relayed: '别人转述'},
  ev: {preflight: '准备', executing: '开始', provider: '模型', workflow: '子流程', workflow_agent: '子代理', tool: '工具',
    text: '回复', finished: '结束', decision: '验收', cancelling: '取消'},
  warn: {
    original_changed_during_run: ['期间你的项目有改动', '合入前确认改动还能用上'], protected_touched: ['动了受保护的文件', '需要 Codex 逐个放行'],
    outside_hint: ['改了预期外的文件', '确认这些改动是否需要'], tool_denied: ['有操作被拦下', 'Claude 的部分操作没获准'],
    source_not_read: ['有附件没读', 'Claude 可能漏看了这些文件'], workflow_incomplete: ['子流程没跑完', '部分 Workflow 未完成或失败'],
    report_missing: ['没交报告', '可以看“最后回复”'], result_missing: ['没交结果数据', '所以没有 Claude 自评'],
    result_malformed: ['结果数据格式不对', '自评可能不完整'], residual_processes_stopped: ['已停掉遗留进程', 'Claude 退出后还有进程在跑'],
    process_stop_unconfirmed: ['不确定进程已停', '请检查是否还有进程在跑'], sensitive_inputs_skipped: ['部分附件没给 Claude', '敏感、链接或过大的文件被跳过'],
    resume_fallback: ['没能接上上一轮', '这一轮换了新会话'], questions_for_user: ['Claude 有问题问你', '需要你来定，Codex 不代答'],
    disputes_present: ['Claude 有不同意见', '看看它反对的是哪条'], not_verified_present: ['有内容没验证', 'Claude 自己说这些没核实'],
    provider_error: ['模型服务出错', 'Claude 那边返回了错误'], patch_unavailable: ['没能整理出改动', '改动清单暂不可用'],
    carried_already_in_original: ['之前的改动已合入', '上一轮的改动已在项目里'], finalize_error: ['结果没汇总全', '请看下方详细资料'],
    undelivered_files_now_ignored: ['有改动被忽略规则挡住', '这些文件现在被 Git 忽略']},
};
const ASK = 'questions_for_user', QUIET_EV = new Set(['preflight', 'executing', 'finished', 'decision', 'cancelling', 'tool']);
const TOOL_TEXT = {Read: '读取', NotebookRead: '读取', Write: '写入', Edit: '修改', MultiEdit: '修改', NotebookEdit: '修改',
  Bash: '运行命令', Grep: '搜索', Glob: '查找文件', LS: '查看目录', Agent: '派子代理', Task: '派子代理', Skill: '使用技能',
  WebFetch: '打开网页', WebSearch: '联网搜索', TodoWrite: '更新待办', Workflow: '启动子流程'};
const EV_TEXT = {'checking the local Claude CLI': '检查本机 Claude', 'preparing the workspace': '准备工作目录',
  'Claude started': 'Claude 开始工作', 'provider lifecycle event': '模型服务状态', 'cancellation requested': '已请求取消',
  'workflow activity': '子流程活动', 'workflow agent': '子代理'};
const ARTS = [['report', '报告'], ['patch', '本轮改动'], ['events', '过程记录']];
const MORE_ARTS = [['brief', '任务书'], ['packet', '你的原话'], ['inputs', '附件'], ['instruction_layer', 'Claude 配置'],
  ['result', '结果数据'], ['final_message', '最后回复'], ['delivery_patch', '累计改动']];
const JSON_ARTS = new Set(['result', 'packet', 'inputs', 'instruction_layer']);

const hashParams = new URLSearchParams(location.hash.slice(1));
const S = {
  token: hashParams.get('token') || '', sel: hashParams.get('run') || '', runs: new Map(), pageEnd: 0, hasMore: false,
  listLoaded: false, listSeq: 0, listApplied: 0, listSig: '', snap: null, runSig: '', tabSig: '', heroSig: '', runError: '', gen: 0,
  events: [], cursor: 0, evTrimmed: false, artName: '', art: null, artSeq: 0, moreArts: false, drawer: false,
  timers: {}, dead: false, conn: '',
};

const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

function el(tag, cls, ...kids) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  for (const kid of kids) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
function button(text, cls, onClick) {
  const node = el('button', cls, text);
  node.type = 'button';
  node.addEventListener('click', onClick);
  return node;
}
function label(map, key, fallback) {
  if (key === null || key === undefined || key === '') return fallback === undefined ? '—' : fallback;
  return Object.hasOwn(map, key) ? map[key] : String(key);
}
const warnInfo = code => (Object.hasOwn(L.warn, code || '') ? L.warn[code] : ['其他提醒', code || '']);
function fill(node, ...kids) { node.replaceChildren(...kids.filter(Boolean)); }
function badge(text, tone) { return el('span', 'badge' + (tone ? ' ' + tone : ''), text); }
function list(items, cls) { return el('ul', cls, ...items.map(item => el('li', null, item))); }
function kv(rows) {
  const dl = el('dl', 'kv');
  for (const [key, value] of rows) if (value !== undefined && value !== null && value !== '') dl.append(el('dt', null, key), el('dd', null, value));
  return dl;
}
function table(heads, rows) {
  const head = el('tr', null, ...heads.map(h => el('th', null, h)));
  const body = el('tbody', null, ...rows.map(cells => el('tr', null, ...cells.map(c => el('td', null, c)))));
  return el('div', 'scroll', el('table', null, el('thead', null, head), body));
}
function fmtDur(s) {
  if (typeof s !== 'number' || !isFinite(s)) return '—';
  if (s < 60) return s.toFixed(1) + ' 秒';
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  if (m >= 60) return `${Math.floor(m / 60)} 小时 ${m % 60} 分`;
  return r ? `${m} 分 ${r} 秒` : `${m} 分钟`;
}
function fmtTime(sec, clockOnly) {
  if (typeof sec !== 'number' || !isFinite(sec)) return '—';
  const d = new Date(sec * 1000);
  return clockOnly ? d.toLocaleTimeString('zh-CN', {hour12: false}) : d.toLocaleString('zh-CN', {hour12: false});
}
function fmtShort(sec) {
  if (typeof sec !== 'number' || !isFinite(sec)) return '—';
  const d = new Date(sec * 1000), pad = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtBytes(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '—';
  return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
}
function evText(e) {
  if (e && e.kind === 'tool') {
    const verb = Object.hasOwn(TOOL_TEXT, e.tool || '') ? TOOL_TEXT[e.tool] : '使用 ' + (e.tool || e.summary || '工具');
    return verb + (e.file ? ' ' + e.file : '') + (e.text ? '：' + e.text : '');

    if (!more && seq < S.listApplied) return;

  $('artTabs').replaceChildren(...primary.map(artTab), more, ...(open ? [el('span', 'tab-break'), ...extra.map(artTab)] : []));
}
function renderArtifact() {
  renderArtTabs();
  const meta = $('artMeta'), body = $('artBody'), more = $('artMore');
  more.hidden = true;
  if (S.artName === 'events') {
    meta.replaceChildren(el('span', null, `共 ${S.events.length} 条` + (S.evTrimmed ? `（只留最近 ${MAX_EVENTS} 条）` : '')));
    body.replaceChildren(eventsView());
    return;
  }
  const a = S.art;
  if (!a) { meta.replaceChildren(); body.replaceChildren(); return; }
  if (a.error && !a.parts.length && a.json === undefined) {
    meta.replaceChildren();
    body.replaceChildren(el('p', 'muted', '读取失败：' + a.error));
    return;
  }
  if (a.available === false) {
    meta.replaceChildren();
    body.replaceChildren(el('p', 'muted', S.snap && S.snap.active ? '还在进行，这份还没生成' : '这一轮没有这份资料'));
    return;
  }
  if (a.available === undefined) {
    meta.replaceChildren();
    body.replaceChildren(el('p', 'muted', '正在加载…'));
    return;
  }
  const o = S.snap && S.snap.outcome;
  const recorded = o ? {report: o.report && o.report.sha256, brief: o.brief && o.brief.sha256}[a.name] : null;
  fill(meta,
    a.name === 'brief' ? el('b', null, '这是 Claude 实际收到的原文') : null,
    el('span', null, a.end ? fmtBytes(a.size) : `已加载 ${fmtBytes(a.next)} / 共 ${fmtBytes(a.size)}`),
    recorded ? el('span', recorded === a.sha ? null : 'bad-text', recorded === a.sha ? '校验一致' : '校验不一致，内容和记录对不上') : null,
    el('details', null, el('summary', null, '校验码'), el('code', null, a.sha || '—')),
    a.error ? el('span', null, '继续读取失败：' + a.error) : null);
  if (!a.end) {
    more.hidden = false;
    more.disabled = !!a.loading;
    more.textContent = a.loading ? '加载中…' : `加载更多（${fmtBytes(a.next)} / ${fmtBytes(a.size)}）`;
  }
  body.replaceChildren(artView(a));
}
function artView(a) {
  const text = a.parts.join('');
  let data = a.json;
  if (data === undefined && a.end && JSON_ARTS.has(a.name)) {
    try { data = JSON.parse(text); } catch (error) { data = undefined; }
  }
  if (data !== undefined && data !== null && typeof data === 'object') {
    if (a.name === 'packet') return packetView(data);
    if (a.name === 'inputs') return inputsView(data);
    if (a.name === 'instruction_layer') return layerView(data);
    return el('pre', 'view', JSON.stringify(data, null, 2));
  }
  if (data !== undefined) return el('pre', 'view', JSON.stringify(data));
  if (a.name === 'patch' || a.name === 'delivery_patch') return diffView(text);
  return el('pre', 'view', text);
}
function diffView(text) {
  const pre = el('pre', 'view');
  const lines = text.split('\n');
  if (lines.length > 6000) {
    pre.append(document.createTextNode(text));
    return pre;
  }
  lines.forEach((line, i) => {
    const content = line + (i < lines.length - 1 ? '\n' : '');
    const cls = /^(\+\+\+|---)( |$)|^@@|^diff /.test(line) ? 'hunk' : line[0] === '+' ? 'add' : line[0] === '-' ? 'del' : '';
    pre.append(cls ? el('span', cls, content) : document.createTextNode(content));
  });
  return pre;
}
function packetView(p) {
  const msgs = Array.isArray(p.user_messages) ? p.user_messages : [];
  const box = el('div', null, el('p', 'muted', 'Codex 原样转给 Claude 的话，一字没改'));
  msgs.forEach((m, i) => {
    const head = `第 ${i + 1} 条 · ${label(L.source, m && m.source, '来源未注明')}` + (m && m.at ? ' · ' + m.at : '');
    box.append(el('div', 'msg', el('div', 'muted', head), el('div', 'verbatim', String((m && m.text) ?? ''))));
  });
  if (!msgs.length) {
    box.append(el('div', 'msg', el('div', 'muted', 'Codex 没转你的原话，理由是：'),
      el('div', 'verbatim', p.no_user_words_reason == null ? '（没写理由）' : String(p.no_user_words_reason))));
  }
  return box;
}
function inputsView(d) {
  const entries = Array.isArray(d.inputs) ? d.inputs : [];
  const skipped = Array.isArray(d.skipped) ? d.skipped : [];
  const box = el('div', null, el('p', 'muted', '开始时交给 Claude 的文件副本'));
  if (!entries.length) box.append(el('p', 'muted', '这一轮没有附件'));
  else box.append(table(['路径', '类型', '大小', '校验码'], entries.map(x => [el('code', null, x.original || x.copy || '—'),
    x.kind === 'directory' ? `文件夹 · ${x.files ?? 0} 个文件` : '文件', fmtBytes(x.bytes), el('code', null, x.sha256 || '—')])));
  if (skipped.length) box.append(el('p', null, '没交给 Claude 的：'), list(skipped.map(String), 'mono'));
  return box;
}
function layerView(d) {
  const files = Array.isArray(d.files) ? d.files : [];
  const hooks = Array.isArray(d.hooks) ? d.hooks : [];
  const o = S.snap && S.snap.outcome;
  const plugins = (o && o.instruction_layer && o.instruction_layer.plugins) || [];
  const box = el('div', null, el('p', 'muted', 'Claude 按你的设置加载的规则和插件'));
  box.append(el('h3', null, `规则文件（${files.length}）`));
  if (files.length) box.append(table(['路径', '范围', '大小', '校验码'], files.map(f => [el('code', null, f.path || '—'), f.scope || '—',
    f.readable === false ? '读不了' : fmtBytes(f.bytes), el('code', null, f.sha256 || '—')])));
  box.append(el('h3', null, `Hooks（${hooks.length}）`));
  if (hooks.length) box.append(list(hooks.map(h => el('code', null, [h.source, h.event, h.matcher, h.command || h.note].filter(Boolean).join(' · ')))));
  box.append(el('h3', null, `插件（${plugins.length}）`), plugins.length ? list(plugins.map(String)) : el('p', 'muted', '没有插件'));
  if (d.note) box.append(el('p', 'muted verbatim', d.note));
  return box;
}
function eventsView() {
  if (!S.events.length) return el('p', 'muted', S.snap && S.snap.active ? '等 Claude 开始…' : '没有过程记录');
  const shown = S.events.slice(-SHOWN_EVENTS);
  const box = el('div', null);
  if (shown.length < S.events.length) box.append(el('p', 'muted', `只显示最近 ${SHOWN_EVENTS} 条`));
  const rows = [];
  for (const e of shown) {
    const prev = rows[rows.length - 1];
    if (prev && e.kind === 'provider' && prev.e.kind === 'provider') { prev.n++; prev.last = e; continue; }
    rows.push({e, n: 1, last: e});
  }
  for (const {e, n, last} of rows) {
    const quiet = QUIET_EV.has(e.kind), extra = n > 1 ? `共 ${n} 条` : [quiet ? '' : e.status, quiet ? '' : e.tool, quiet ? '' : e.file].filter(Boolean).join(' · ');
    box.append(el('div', 'ev', el('span', 'muted', fmtTime(last.received_at, true)), el('span', 'k muted', label(L.ev, e.kind, '')),
      el('div', null, el('span', null, evText(e)), extra ? el('span', 'muted', ' · ' + extra) : null,
        e.text && e.kind !== 'tool' ? el('div', 'muted verbatim', e.text) : null)));
  }
  return box;
}

function boot() {
  $('moreRuns').addEventListener('click', () => refreshList(true));
  $('artMore').addEventListener('click', () => {
    if (S.art && !S.art.loading && !S.art.end) loadArtifact(S.art.name, true);
  });
  $('listToggle').addEventListener('click', () => setDrawer(!S.drawer));
  $('emptyOpen').addEventListener('click', () => setDrawer(true));
  $('scrim').addEventListener('click', () => setDrawer(false));
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && S.drawer) setDrawer(false); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || S.dead) return;
    listLoop();
    runLoop();
  });
  window.addEventListener('hashchange', () => {
    const params = new URLSearchParams(location.hash.slice(1));
    if ((params.get('token') || '') !== S.token) location.reload();
    else if (params.get('run')) selectRun(params.get('run'));
  });
  renderList();
  renderRun();
  if (!S.token) {
    setConn('auth');
    return;
  }
  listLoop();
  if (S.sel) {
    const id = S.sel;
    S.sel = '';
    selectRun(id);
  }
}
boot();
